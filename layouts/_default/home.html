{{define "main"}}
    <section class="grain flex min-h-screen items-center overflow-hidden px-6 pb-16 pt-40">
        <img src="/media/img/on-hands.webp" alt="" class="absolute inset-0 h-full w-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-b from-obsidian via-obsidian/40 to-obsidian"></div>
        <div class="relative z-10 mx-auto flex w-full max-w-7xl flex-col items-end text-right">
            <div class="glass-card fade-up mb-6 inline-flex items-center gap-2 rounded-full px-3.5 py-1.5 text-sm font-medium text-zinc-300">
                <span class="relative z-10 h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
                <span class="relative z-10">{{ i18n "available_badge" }}</span>
            </div>
            <p class="fade-up mb-3 text-sm font-semibold uppercase tracking-widest text-zinc-500" style="animation-delay:.05s">Petr Geršl</p>
            <h1 class="fade-up mb-6 max-w-4xl text-5xl font-bold leading-[1.1] tracking-tight text-white md:text-6xl lg:text-8xl" style="animation-delay:.1s">{{ i18n "hero_headline" | safeHTML }}</h1>
            <p class="fade-up mb-10 max-w-4xl text-lg font-light leading-relaxed text-zinc-400 md:text-xl" style="animation-delay:.2s">{{ i18n "hero_subhead" }}</p>
            <div class="fade-up flex flex-wrap items-center justify-end gap-4" style="animation-delay:.3s">
                <a href="#now" class="rounded-full bg-white px-6 py-3.5 text-base font-medium text-black transition-all hover:bg-zinc-200">{{ i18n "explore_activities" }}</a>
                <a href="{{ with .Site.GetPage "/contact" }}{{.RelPermalink}}{{end}}" class="glass-card rounded-full px-6 py-3.5 text-base font-medium text-white transition-all hover:bg-white/10">
                    <span class="relative z-10">{{ i18n "get_in_touch" }}</span>
                </a>
            </div>
        </div>
    </section>

    <section id="now" class="mx-auto max-w-7xl px-6 py-20">
        <div class="fade-up mb-12">
            <h2 class="mb-3 text-sm font-semibold uppercase tracking-widest text-zinc-500">{{ i18n "core_disciplines" }}</h2>
            <h3 class="text-3xl font-semibold tracking-tight text-white md:text-4xl">{{ i18n "what_i_do" }}</h3>
        </div>
        <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-4">
            {{.Content}}
        </div>
    </section>
{{end}}
